
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rastgele Twitter Web Viewer</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(90%, 440px);
      padding: 30px 24px;
      box-sizing: border-box;
      text-align: center;
      background: #1f2937;
      border-radius: 18px;
    }

    h1 { font-size: 23px; }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    a {
      color: #93c5fd;
      overflow-wrap: anywhere;
    }

    .loader {
      width: 36px;
      height: 36px;
      margin: 25px auto;
      border: 4px solid #475569;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    button {
      margin-top: 16px;
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>Rastgele Profil Yönlendirici</h1>
    <div class="loader" id="loader"></div>
    <p id="message">Rastgele profil seçiliyor...</p>
    <p id="destination"></p>
    <button id="retry" hidden>Başka profil seç</button>
  </main>

  <script>
    // URL ve ağırlık bilgileri
    const sites = [
      { url: "https://twitterwebviewer.net/?user=ekonomimcom", weight: 9 },
      { url: "https://twitterwebviewer.net/?user=gazeteoksijen", weight: 8 },
      { url: "https://twitterwebviewer.net/?user=FT", weight: 6 },
      { url: "https://twitterwebviewer.net/?user=iriscibrelos", weight: 20 },
      { url: "https://twitterwebviewer.net/?user=PiyasaOttoman91", weight: 7 },
      { url: "https://twitterwebviewer.net/?user=gurkaynakgonenc", weight: 7 },
      { url: "https://twitterwebviewer.net/?user=ahmetcigsar", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=61ramazanbasak", weight: 10 },
      { url: "https://twitterwebviewer.net/?user=mserdark", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=ozngndgdu", weight: 5 },
{ url: "https://twitterwebviewer.net/?user=banka_dunyasi", weight: 9 },
      { url: "https://twitterwebviewer.net/?user=timursoykan", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=tvonlar", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=iktisatoplum", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=birikimdergisi", weight: 6 },
      { url: "https://twitterwebviewer.net/?user=tebernkireci1", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=merkez_bankasi", weight: 6 },
      { url: "https://twitterwebviewer.net/?user=ismailsaymaz", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=brianroemmele", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=scobleizer", weight: 6 },
      { url: "https://twitterwebviewer.net/?user=santmanukyan", weight: 7 },
      { url: "https://twitterwebviewer.net/?user=_kemalcan", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=samiltayyar27", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=memetsimsek", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=abdulkdir_selvi", weight: 5 },
      { url: "https://twitterwebviewer.net/?user=e507", weight: 12 },
      { url: "https://twitterwebviewer.net/?user=ali_hakan_kara", weight: 5 },
{ url: "https://twitterwebviewer.net/?user=guvsak", weight: 7 },
      { url: "https://twitterwebviewer.net/?user=kaansezyum", weight: 9 }
    ];

    function selectRandomSite() {
      const message = document.getElementById("message");
      const destination = document.getElementById("destination");
      const loader = document.getElementById("loader");
      const retry = document.getElementById("retry");

      // Yalnızca geçerli HTTP/HTTPS adreslerini ve
      // pozitif ağırlıkları kullan.
      const validSites = sites.filter(site => {
        try {
          const url = new URL(site.url);
          return (
            (url.protocol === "https:" || url.protocol === "http:") &&
            Number.isFinite(site.weight) &&
            site.weight > 0
          );
        } catch {
          return false;
        }
      });

      if (validSites.length === 0) {
        loader.hidden = true;
        message.textContent = "Geçerli site bulunamadı.";
        retry.hidden = false;
        return;
      }

      const totalWeight = validSites.reduce(
        (sum, site) => sum + site.weight, 0
      );

      let random = Math.random() * totalWeight;
      let selected = validSites[validSites.length - 1];

      for (const site of validSites) {
        random -= site.weight;

        if (random < 0) {
          selected = site;
          break;
        }
      }

      message.textContent = "Seçilen profile yönlendiriliyorsunuz...";
      destination.replaceChildren();

      const link = document.createElement("a");
      link.href = selected.url;
      link.textContent = selected.url;
      destination.appendChild(link);

      // Yönlendirmeyi başlat.
      window.location.replace(selected.url);
    }

    document.getElementById("retry").addEventListener(
      "click", selectRandomSite
    );

    selectRandomSite();
  </script>
</body>
</html>
