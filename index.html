
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastgele Site Yönlendirici</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      width: min(90%, 420px);
      padding: 32px 24px;
      box-sizing: border-box;
      text-align: center;
      background: #1f2937;
      border-radius: 18px;
    }

    h1 { font-size: 24px; }

    p { color: #cbd5e1; line-height: 1.6; }

    a {
      color: #93c5fd;
      overflow-wrap: anywhere;
    }

    .loader {
      width: 36px;
      height: 36px;
      margin: 24px auto;
      border: 4px solid #475569;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Rastgele Site Yönlendirici</h1>
    <div class="loader" id="loader"></div>
    <p id="message">Bir site seçiliyor, lütfen bekle...</p>
    <p id="destination"></p>
    <button id="retry" hidden>Başka bir site seç</button>
  </main>

  <script>
    // Kendi sitelerini bu listeye ekle.
    const sites = [
      "https://example.com",
      "https://www.wikipedia.org",
      "https://www.mozilla.org"
    ];

    function selectRandomSite() {
      const message = document.getElementById("message");
      const destination = document.getElementById("destination");
      const loader = document.getElementById("loader");
      const retry = document.getElementById("retry");

      // Geçerli HTTP/HTTPS adreslerini al.
      const validSites = sites.filter(address => {
        try {
          const url = new URL(address);
          return url.protocol === "https:" ||
                 url.protocol === "http:";
        } catch {
          return false;
        }
      });

      if (validSites.length === 0) {
        loader.hidden = true;
        message.textContent = "Henüz geçerli bir site eklenmedi.";
        retry.hidden = false;
        return;
      }

      const selected =
        validSites[Math.floor(Math.random() * validSites.length)];

      message.textContent = "Seçilen siteye yönlendiriliyorsunuz...";
      destination.replaceChildren();

      const link = document.createElement("a");
      link.href = selected;
      link.textContent = selected;
      destination.appendChild(link);

      // Seçilen adrese otomatik git.
      window.location.replace(selected);
    }

    document.getElementById("retry").addEventListener(
      "click", selectRandomSite
    );

    selectRandomSite();
  </script>
</body>
</html>
