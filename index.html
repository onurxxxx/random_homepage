<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101827">
<title>Profil Arşivi</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f30;--line:#29384d;--text:#f3f6fb;--muted:#9aabc0;--blue:#3478ed;--blue-soft:#172b49}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100% - 28px,620px);margin:auto;padding:max(26px,env(safe-area-inset-top)) 0 max(32px,env(safe-area-inset-bottom))}
header{padding:4px 2px 18px}
.eyebrow{margin:0 0 7px;color:#70a7ff;font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
h1{margin:0;font-size:25px;letter-spacing:-.04em}
.intro{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.random-card{padding:16px;border:1px solid #2d4770;border-radius:17px;background:linear-gradient(145deg,#1b2c46,#142033 75%);box-shadow:0 12px 30px #0003}
.random-card p{margin:0 0 12px;color:#b6c6da;font-size:13px}
button{border:0;border-radius:11px;background:var(--blue);color:white;font:inherit;font-size:14px;font-weight:750;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.985);background:#2867d2}
#randomButton{width:100%;min-height:48px}
.result{display:none;margin-top:12px;padding:11px 12px;border:1px solid #385477;border-radius:10px;background:#101b2b}
.result.visible{display:block}
.result-label{display:block;margin-bottom:4px;color:var(--muted);font-size:11px}
.result a{color:#c8dcff;font-size:14px;font-weight:650;overflow-wrap:anywhere;text-decoration:none}
.list-section{margin-top:25px}
.list-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 10px}
.list-heading h2{margin:0;font-size:17px}
.count{color:var(--muted);font-size:12px;white-space:nowrap}
.search-wrap{position:relative}
input{width:100%;min-height:46px;margin-bottom:10px;padding:0 42px 0 13px;border:1px solid var(--line);border-radius:11px;outline:none;background:var(--panel);color:var(--text);font:inherit;font-size:14px}
input:focus{border-color:#5b91e5;box-shadow:0 0 0 3px #3478ed22}
.search-icon{position:absolute;right:14px;top:11px;color:var(--muted);pointer-events:none}
.filters{display:flex;gap:7px;overflow-x:auto;padding:1px 0 11px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-chip{flex:0 0 auto;min-height:33px;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:#c7d3e2;font-size:12px;font-weight:600}
.filter-chip.active{border-color:#477fcf;background:var(--blue-soft);color:#d8e7ff}
.category-list{display:grid;gap:8px}
.category{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.category[hidden]{display:none}
.category summary{display:flex;align-items:center;gap:10px;min-height:53px;padding:0 13px;cursor:pointer;list-style:none;user-select:none}
.category summary::-webkit-details-marker{display:none}
.category summary:after{content:"＋";margin-left:auto;color:#8fa4c0;font-size:17px}
.category[open] summary:after{content:"−"}
.category-name{font-size:14px;font-weight:700}
.category-count{margin-left:auto;color:var(--muted);font-size:11px}
.category summary .category-count{margin-left:auto}
.category[open] summary .category-count{margin-left:0}
.site-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:0 9px 10px}
.site-link{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:49px;padding:9px 10px;border:1px solid #2b3b52;border-radius:10px;background:#101a29;color:var(--text);text-decoration:none;-webkit-tap-highlight-color:transparent;min-width:0}
.site-link:active{background:#1b293d;border-color:#49658a}
.site-info{min-width:0}
.site-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.site-domain{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:400}
.arrow{flex:0 0 auto;color:#8298b5;font-size:16px}
.empty{padding:20px 12px;color:var(--muted);text-align:center;font-size:13px;border:1px dashed var(--line);border-radius:12px}
.hint{margin:10px 2px 0;color:#8193aa;font-size:11px;line-height:1.45}
@media(min-width:520px){main{padding-top:38px}.site-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main>

<section class="random-card" aria-label="Rastgele profil">
    <button id="randomButton" type="button">Rastgele profil aç</button>
  <div class="result" id="result" aria-live="polite">
    <span class="result-label">Açılan profil</span>
    <a id="selectedLink" href="#" target="_blank" rel="noopener noreferrer"></a>
  </div>
</section>

<section class="list-section" aria-labelledby="list-title">
  <div class="list-heading">
    
    <span class="count" id="count"></span>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Profil veya kategori ara..." autocomplete="off" aria-label="Profil veya kategori ara">
    <span class="search-icon" aria-hidden="true">⌕</span>
  </div>
  <div class="filters" id="filters" aria-label="Kategori filtreleri"></div>
  <div class="category-list" id="categoryList" aria-label="Profil kategorileri"></div>
  <p class="hint">Bir kategoriye dokunarak açıp kapatabilirsin. Arama yaptığında eşleşen kategoriler otomatik açılır.</p>
</section>
</main>
<script>
const sites=[

{url:"https://twitterviewer.net/ekonomimcom",weight:9},
{url:"https://twitterviewer.net/gazeteoksijen",weight:8},
{url:"https://twitterviewer.net/FT",weight:6},

{url:"https://twitterviewer.net/brianroemmele",weight:5},
{url:"https://twitterviewer.net/scobleizer",weight:6},
{url:"https://twitterviewer.net/mertcobanov",weight:6},

{url:"https://twitterviewer.net/iriscibrelos",weight:20},
{url:"https://twitterviewer.net/e507",weight:12},
{url:"https://twitterviewer.net/santmanukyan",weight:7},
{url:"https://twitterviewer.net/kerimrota",weight:5},
{url:"https://twitterviewer.net/akinrota",weight:5},
{url:"https://twitterviewer.net/61ramazanbasak",weight:10},
{url:"https://twitterviewer.net/senolbabuscu",weight:5},
{url:"https://twitterviewer.net/ali_hakan_kara",weight:5},
{url:"https://twitterviewer.net/ahmetirfans",weight:5},
{url:"https://twitterviewer.net/guvsak",weight:5},
{url:"https://twitterviewer.net/tebernkireci1",weight:5},
{url:"https://medium.com/@dzctzbt",weight:5},

{url:"https://twitterviewer.net/bosunatiklama",weight:6},
{url:"https://twitterviewer.net/banka_dunyasi",weight:9},
{url:"https://twitterviewer.net/patronlar",weight:9},
{url:"https://twitterviewer.net/PiyasaOttoman8a",weight:7},
{url:"https://twitterviewer.net/gurkaynakgonenc",weight:7},
{url:"https://twitterviewer.net/mserdark",weight:5},
{url:"https://twitterviewer.net/ahmetcigsar",weight:5},
{url:"https://twitterviewer.net/kaansezyum",weight:9},
{url:"https://twitterviewer.net/buitengebieden",weight:9},
{url:"https://twitterviewer.net/gokhanyucel",weight:9},


{url:"https://twitterviewer.net/ismailsaymaz",weight:5},
{url:"https://twitterviewer.net/ozngndgdu",weight:5},
{url:"https://twitterviewer.net/lordsinov",weight:5},
{url:"https://twitterviewer.net/timursoykan",weight:5},
{url:"https://twitterviewer.net/tvonlar",weight:5},
{url:"https://twitterviewer.net/_kemalcan",weight:5},
{url:"https://twitterviewer.net/samiltayyar27",weight:5},
{url:"https://twitterviewer.net/abdulkdir_selvi",weight:5},

{url:"https://twitterviewer.net/iktisatoplum",weight:5},
{url:"https://twitterviewer.net/birikimdergisi",weight:6},

{url:"https://twitterviewer.net/merkez_bankasi",weight:6},
{url:"https://www.muhasebetr.com/yazarlarimiz",weight:5},

];

const categories = [
  {id:"ekonomi", name:"Ekonomi", handles:[
    "ekonomimcom","FT","iriscibrelos","e507","santmanukyan","kerimrota","akinrota",
    "senolbabuscu","ali_hakan_kara","ahmetirfans",
    "guvsak","tebernkireci1","banka_dunyasi","patronlar",
    "PiyasaOttoman8a","merkez_bankasi","@dzctzbt"
  ]},
  {id:"haber", name:"Gündem", handles:[
    "gazeteoksijen","bosunatiklama","ismailsaymaz","ozngndgdu","lordsinov","timursoykan",
    "tvonlar","_kemalcan","samiltayyar27","61ramazanbasak","abdulkdir_selvi"
  ]},
  {id:"teknoloji", name:"Teknoloji", handles:[
    "brianroemmele","scobleizer","mertcobanov","mserdark"
  ]},
  {id:"fikir", name:"Yayınlar", handles:[
    "iktisatoplum","yazarlarimiz","birikimdergisi"
  ]},
  {id:"kesif", name:"Keşif", handles:[
    "gurkaynakgonenc","ahmetcigsar",
    "kaansezyum","gokhanyucel","buitengebieden"
  ]}
];

const validSites=sites.filter(s=>{
  try{const u=new URL(s.url);return ["https:","http:"].includes(u.protocol)&&Number.isFinite(s.weight)&&s.weight>0}
  catch{return false}
});
const list=document.getElementById("categoryList");
const search=document.getElementById("search");
const count=document.getElementById("count");
const filters=document.getElementById("filters");
let activeCategory="all";

function nameOf(site){
  const u=new URL(site.url);
  return decodeURIComponent(u.pathname.split("/").filter(Boolean).pop()||u.hostname);
}
function categoryFor(site){
  const handle=nameOf(site);
  return categories.find(c=>c.handles.includes(handle)) || {id:"diger",name:"Diğer Profiller",handles:[]};
}
function makeLink(site){
  const a=document.createElement("a");
  a.className="site-link";a.href=site.url;a.target="_blank";a.rel="noopener noreferrer";
  const info=document.createElement("span");info.className="site-info";
  const n=document.createElement("span");n.className="site-name";n.textContent=nameOf(site);
  const d=document.createElement("span");d.className="site-domain";d.textContent=new URL(site.url).hostname;
  info.append(n,d);
  const arrow=document.createElement("span");arrow.className="arrow";arrow.setAttribute("aria-hidden","true");arrow.textContent="↗";
  a.append(info,arrow);return a;
}
function allCategories(){
  const grouped=categories.map(c=>({...c,sites:validSites.filter(s=>categoryFor(s).id===c.id)})).filter(c=>c.sites.length);
  const leftovers=validSites.filter(s=>categoryFor(s).id==="diger");
  if(leftovers.length)grouped.push({id:"diger",name:"Diğer Profiller",sites:leftovers});
  return grouped;
}
function renderFilters(groups){
  filters.replaceChildren();
  const items=[{id:"all",name:"Tümü",n:validSites.length},...groups.map(g=>({id:g.id,name:g.name,n:g.sites.length}))];
  items.forEach(item=>{
    const b=document.createElement("button");b.type="button";b.className="filter-chip"+(activeCategory===item.id?" active":"");
    b.textContent=item.name;b.setAttribute("aria-pressed",String(activeCategory===item.id));
    b.addEventListener("click",()=>{activeCategory=item.id;render(search.value);});
    filters.append(b);
  });
}
function render(filter=""){
  const q=filter.trim().toLocaleLowerCase("tr-TR");
  const groups=allCategories();
  renderFilters(groups);
  list.replaceChildren();
  let visible=0;
  groups.forEach(group=>{
    const categoryMatch=group.name.toLocaleLowerCase("tr-TR").includes(q);
    const matches=group.sites.filter(s=>categoryMatch || nameOf(s).toLocaleLowerCase("tr-TR").includes(q) || new URL(s.url).hostname.toLowerCase().includes(q));
    const shown=matches.filter(s=>activeCategory==="all"||activeCategory===group.id);
    const section=document.createElement("details");section.className="category";
    section.hidden=shown.length===0;
section.open=shown.length>0;
section.dataset.category=group.id;
    const summary=document.createElement("summary");
    const title=document.createElement("span");title.className="category-name";title.textContent=group.name;
    const badge=document.createElement("span");badge.className="category-count";badge.textContent=shown.length+" profil";
    summary.append(title,badge);
    const grid=document.createElement("div");grid.className="site-list";
    shown.forEach(s=>grid.append(makeLink(s)));
    section.append(summary,grid);list.append(section);
    visible+=shown.length;
  });
  
  if(!visible){const e=document.createElement("div");e.className="empty";e.textContent="Eşleşen profil bulunamadı.";list.append(e);}
}
function randomSite(){
  const total=validSites.reduce((sum,s)=>sum+s.weight,0);
  let r=Math.random()*total,chosen=validSites[validSites.length-1];
  for(const s of validSites){r-=s.weight;if(r<0){chosen=s;break;}}
  window.open(chosen.url,"_blank","noopener,noreferrer");
  const result=document.getElementById("result"),link=document.getElementById("selectedLink");
  link.href=chosen.url;link.textContent=nameOf(chosen);result.classList.add("visible");
}
document.getElementById("randomButton").addEventListener("click",randomSite);
search.addEventListener("input",()=>render(search.value));
render();
</script>
</body>
</html>
