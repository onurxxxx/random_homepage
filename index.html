<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101827">
<title>Random</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f30;--line:#29384d;--text:#f3f6fb;--muted:#9aabc0;--blue:#3478ed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100% - 28px,560px);margin:auto;padding:max(28px,env(safe-area-inset-top)) 0 max(32px,env(safe-area-inset-bottom))}
header{padding:8px 2px 20px}.eyebrow{margin:0 0 7px;color:#70a7ff;font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
h1{margin:0;font-size:25px;letter-spacing:-.04em}.intro{margin:7px 0 0;color:var(--muted);font-size:14px}
.random-card{padding:19px;border:1px solid #2d4770;border-radius:18px;background:linear-gradient(145deg,#1b2c46,#142033 75%);box-shadow:0 12px 30px #0003}
.random-card h2{margin:0;font-size:17px}.random-card p{margin:5px 0 15px;color:#b6c6da;font-size:13px;line-height:1.45}
button{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--blue);color:white;font:inherit;font-size:15px;font-weight:750;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.985);background:#2867d2}
.result{display:none;margin-top:13px;padding:12px 13px;border:1px solid #385477;border-radius:11px;background:#101b2b}
.result.visible{display:block}.result-label{display:block;margin-bottom:4px;color:var(--muted);font-size:11px}
.result a{color:#c8dcff;font-size:14px;font-weight:650;overflow-wrap:anywhere;text-decoration:none}
.list-section{margin-top:27px}.list-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
.list-heading h2{margin:0;font-size:17px}.count{color:var(--muted);font-size:12px}
input{width:100%;min-height:44px;margin-bottom:10px;padding:0 13px;border:1px solid var(--line);border-radius:11px;outline:none;background:var(--panel);color:var(--text);font:inherit;font-size:14px}
input:focus{border-color:#5b91e5;box-shadow:0 0 0 3px #3478ed22}
.site-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}.site-link{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);text-decoration:none;-webkit-tap-highlight-color:transparent}
.site-link:active{background:#1b293d;border-color:#49658a}.site-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600}
.site-domain{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:400}.arrow{flex:0 0 auto;color:#8298b5;font-size:19px}
.empty{padding:18px 12px;color:var(--muted);text-align:center;font-size:13px}
@media (min-width:520px) {
  main { padding-top:42px; }
  .random-card { padding:22px; }
}
</style>
</head>
<body>
<main>
<section class="random-card" aria-labelledby="random-title">
<button id="randomButton" type="button">Rastgele profil aç</button>
</section>
<section class="list-section" aria-labelledby="list-title">

<input id="search" type="search" placeholder="Profil ara..." autocomplete="off" aria-label="Profil ara">
<div class="list-heading"><span class="count" id="count"></span></div>
<nav class="site-list" id="siteList" aria-label="Profil bağlantıları"></nav>
</section>
</main>
<script>
const sites=[
{url:"https://twitterviewer.net/ekonomimcom",weight:9},
{url:"https://twitterviewer.net/gazeteoksijen",weight:8},
{url:"https://twitterviewer.net/FT",weight:6},

{url:"https://twitterviewer.net/brianroemmele",weight:5},
{url:"https://twitterviewer.net/scobleizer",weight:6},
{url:"https://twitterviewer.net/mertcobanov",weight:6},

{url:"https://twitterviewer.net/iriscibrelos",weight:20},
{url:"https://twitterviewer.net/e507",weight:12},
{url:"https://twitterviewer.net/santmanukyan",weight:7},
{url:"https://twitterviewer.net/kerimrota",weight:5},
{url:"https://twitterviewer.net/akinrota",weight:5},
{url:"https://twitterviewer.net/61ramazanbasak",weight:10},
{url:"https://twitterviewer.net/senolbabuscu",weight:5},
{url:"https://twitterviewer.net/ali_hakan_kara",weight:5},
{url:"https://twitterviewer.net/ahmetirfans",weight:5},
{url:"https://twitterviewer.net/guvsak",weight:5},
{url:"https://twitterviewer.net/tebernkireci1",weight:5},
{url:"https://medium.com/@dzctzbt",weight:5},

{url:"https://twitterviewer.net/bosunatiklama",weight:6},
{url:"https://twitterviewer.net/banka_dunyasi",weight:9},
{url:"https://twitterviewer.net/PiyasaOttoman8a",weight:7},
{url:"https://twitterviewer.net/gurkaynakgonenc",weight:7},
{url:"https://twitterviewer.net/mserdark",weight:5},
{url:"https://twitterviewer.net/ahmetcigsar",weight:5},
{url:"https://twitterviewer.net/kaansezyum",weight:9},
{url:"https://twitterviewer.net/buitengebieden",weight:9},
{url:"https://twitterviewer.net/JapanTraCul",weight:9},


{url:"https://twitterviewer.net/ismailsaymaz",weight:5},
{url:"https://twitterviewer.net/ozngndgdu",weight:5},
{url:"https://twitterviewer.net/lordsinov",weight:5},
{url:"https://twitterviewer.net/timursoykan",weight:5},
{url:"https://twitterviewer.net/tvonlar",weight:5},
{url:"https://twitterviewer.net/_kemalcan",weight:5},
{url:"https://twitterviewer.net/samiltayyar27",weight:5},
{url:"https://twitterviewer.net/abdulkdir_selvi",weight:5},

{url:"https://twitterviewer.net/iktisatoplum",weight:5},
{url:"https://twitterviewer.net/birikimdergisi",weight:6},

{url:"https://twitterviewer.net/merkez_bankasi",weight:6},
{url:"https://www.muhasebetr.com/yazarlarimiz",weight:5},

];
const validSites=sites.filter(s=>{try{const u=new URL(s.url);return ["https:","http:"].includes(u.protocol)&&Number.isFinite(s.weight)&&s.weight>0}catch{return false}});
const list=document.getElementById("siteList"),search=document.getElementById("search"),count=document.getElementById("count");
function nameOf(site){const u=new URL(site.url);return decodeURIComponent(u.pathname.split("/").filter(Boolean).pop()||u.hostname)}
function render(filter=""){
const q=filter.trim().toLocaleLowerCase("tr-TR");
const matches=validSites.filter(s=>nameOf(s).toLocaleLowerCase("tr-TR").includes(q)||new URL(s.url).hostname.toLowerCase().includes(q));
list.replaceChildren();count.textContent=matches.length+" / "+validSites.length;
if(!matches.length){const e=document.createElement("div");e.className="empty";e.textContent="Eşleşen profil bulunamadı.";list.append(e);return}
matches.forEach(s=>{const a=document.createElement("a");a.className="site-link";a.href=s.url;a.target="_blank";a.rel="noopener noreferrer";
const info=document.createElement("span");info.style.minWidth="0";const n=document.createElement("span");n.className="site-name";n.textContent=nameOf(s);
const d=document.createElement("span");d.className="site-domain";d.textContent=new URL(s.url).hostname;info.append(n,d);
const arrow=document.createElement("span");arrow.className="arrow";arrow.setAttribute("aria-hidden","true");arrow.textContent="↗";a.append(info,arrow);list.append(a)});
}
function randomSite(){
const total=validSites.reduce((sum,s)=>sum+s.weight,0);let r=Math.random()*total,chosen=validSites[validSites.length-1];
for(const s of validSites){r-=s.weight;if(r<0){chosen=s;break}}
window.open(chosen.url,"_blank","noopener,noreferrer");
}
document.getElementById("randomButton").addEventListener("click",randomSite);
search.addEventListener("input",()=>render(search.value));render();
</script>
</body>
</html>
